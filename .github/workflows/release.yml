name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.9

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build
        run: |
          cmake --preset debug
          cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build the web demos
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --preset web
          cmake --build --preset web

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp build/web/demos/roam_demos.js build/web/demos/roam_demos.wasm build/web/demos/roam_demos.data _site/
          cp build/web/demos/roam_demos.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
